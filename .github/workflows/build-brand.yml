name: Build Ubuntu integration brand assets

on:
  push:
    paths:
      - .github/workflows/build-brand.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-brand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image conversion dependency
        run: python -m pip install 'cairosvg==2.7.1'
      - name: Retrieve original Wikimedia logo and generate PNG assets
        run: |
          mkdir -p custom_components/ubuntu_linux/brand
          curl --fail --location --show-error --silent --retry 3 --proto '=https' --tlsv1.2 \
            'https://upload.wikimedia.org/wikipedia/commons/9/94/Ubuntu_logoib.svg' \
            -o /tmp/ubuntu_logoib.svg
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          svg = Path('/tmp/ubuntu_logoib.svg').read_bytes()
          if b'<svg' not in svg[:2048]:
              raise RuntimeError('Unexpected Wikimedia response')
          brand = Path('custom_components/ubuntu_linux/brand')
          for name, size in (
              ('icon.png', 256),
              ('icon@2x.png', 512),
              ('logo.png', 256),
              ('logo@2x.png', 512),
          ):
              cairosvg.svg2png(bytestring=svg, write_to=str(brand / name),
                               output_width=size, output_height=size)
          PY
      - name: Commit brand files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/ubuntu_linux/brand/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Add Wikimedia Ubuntu logo branding assets"
            git push
          fi
